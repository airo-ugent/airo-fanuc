# SPDX-License-Identifier: Apache-2.0
[build-system]
# 0.11 is the floor that can parse `license`/`license-files` in their PEP 639
# form below; 0.10 rejects the SPDX string and the build fails outright.
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "airo-fanuc"
version = "0.1.0"
description = "FANUC driver: a compiled real-time Stream Motion core behind a Python receive/control API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# NOTICE is listed alongside the license texts because Apache-2.0 section 4(d)
# requires it to travel with any redistribution, and it is where the vendored
# FANUC codec, Ruckig and pybind11 are attributed.
license-files = ["LICENSE", "LICENSES/*", "NOTICE"]
authors = [{ name = "IDLab-AIRO, Ghent University" }]
keywords = ["fanuc", "crx", "stream-motion", "robot", "manipulator", "real-time"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # The RT thread is built on timerfd_create + epoll + SCHED_FIFO; there is no
    # portable fallback, so Linux is not a preference here but a requirement.
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# No "License :: OSI Approved :: ..." classifier: PEP 639 replaced it with the
# `license` field above, and declaring both is an error, not a duplication.

# Runtime deps: numpy only. No airo-robots / zenoh / loguru — the wheel must
# install standalone, so everything environment-specific (a messaging sink, a
# collision checker, a kinematics provider) is injected by the caller instead.
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/airo-ugent/airo-fanuc"
Source = "https://github.com/airo-ugent/airo-fanuc"
Issues = "https://github.com/airo-ugent/airo-fanuc/issues"

[project.optional-dependencies]
# pytest-timeout is required, not optional: the deadlock-regression guards carry
# @pytest.mark.timeout and silently do nothing without it.
# ruff is pinned to a minor: CI gates on `ruff format --check`, and the formatter's
# output is not stable across ruff minors, so an unpinned floor would make the gate
# depend on whichever version the runner resolved.
dev = ["pytest>=8", "pytest-timeout>=2.3", "mypy>=1.15", "ruff>=0.15,<0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "timeout: per-test wall-clock cap (pytest-timeout); guards against deadlock regressions",
]

# ---------------------------------------------------------------------------
# scikit-build-core: build the CMake extension and drop airo_fanuc._core into
# the import package (src/airo_fanuc → airo_fanuc; _core installed there by the
# CMake install() rule).
# ---------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/airo_fanuc"]
# Stable, gitignored build dir so editable rebuilds reuse FetchContent deps.
build-dir = "build/{wheel_tag}"
# The submodule is an entire ROS 2 workspace — hardware interface, MoveIt
# configs, message definitions, a JPEG — of which we compile exactly two headers.
# Excluding it wholesale and re-including those is what keeps the sdist from
# carrying 176 files it cannot use; include wins over exclude, so the order of
# the two lists does not matter. The headers cannot simply be dropped: without
# them `pip install --no-binary airo-fanuc` has nothing to compile against.
# hardware_todo.md is a pre-release checklist for this cell, not documentation for
# someone installing the package; it would read as an inventory of what is broken.
sdist.exclude = ["/build", "/dist", "/vendor/fanuc_driver", "/hardware_todo.md"]
sdist.include = [
    "/vendor/fanuc_driver/fanuc_libs/stream_motion/include",
    "/vendor/fanuc_driver/LICENSES",
]
# Install only our own install() rule (see the COMPONENT note in CMakeLists.txt).
# Without this the wheel also carries Ruckig's install tree into the environment
# root: include/ruckig/, lib/libruckig.a, lib/cmake/ruckig/, share/ruckig/.
install.components = ["PythonModule"]

[tool.scikit-build.cmake]
version = ">=3.22"
build-type = "Release"

[tool.scikit-build.cmake.define]
# The wheel runtime never needs gtest; skip the googletest FetchContent. The
# standalone `cmake -S ... && ctest` build leaves this ON (CMake default).
AIRO_FANUC_BUILD_TESTS = "OFF"

# ---------------------------------------------------------------------------
# cibuildwheel: the published wheels. Without these, the only artifact PyPI would
# accept is the sdist — a plain `uv build` produces a `linux_x86_64` tag, which PyPI
# refuses — and every `pip install airo-fanuc` would compile the extension, needing a
# C++20 compiler, CMake, the Python headers and network access to fetch pybind11 and
# Ruckig. Building inside the manylinux image is what turns that into a download.
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
# One wheel per interpreter: pybind11 does not build against the stable ABI, so there
# is no single abi3 wheel to publish instead. The range covers every CPython the floor in
# requires-python admits, so nobody on a current interpreter silently falls back to
# compiling — 3.14 is included because the extension was verified to build and run there.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# musl is not built: the RT thread's timerfd/epoll/SCHED_FIFO path has only ever run on
# glibc, and shipping an untested musl wheel would let pip prefer it over the sdist a
# musl user would otherwise build and can at least see fail.
#
# Neither is free-threaded 3.14 (`cp314t`), and for a sharper reason: this extension is
# written against a held GIL — the RT thread releases it around exactly the three calls that
# block on I/O and holds it everywhere else — and the pybind11 it is built with predates
# free-threading support. A `cp314t` wheel would install and import, then be wrong under
# concurrency. Leaving it out means a free-threaded interpreter builds from the sdist, which
# is at least a decision its user made.
skip = "*-musllinux_* cp314t-*"
# 2.28 (glibc 2.28) rather than the older default: the C++20 the build needs comes from
# the toolchain in this image, and 2.28 still covers every distribution in support.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# The wheel is worthless if it cannot be imported on the machine that installs it, and
# a missing or mis-tagged extension shows up nowhere else — the build itself succeeds.
# The two suites are the fast ones with no timing assertions: the config/enum surface
# that crosses the pybind11 boundary, and the numpy-only dependency contract.
test-requires = ["pytest>=8", "pytest-timeout>=2.3"]
test-command = [
    "python -c \"import airo_fanuc, airo_fanuc._core as c; print(airo_fanuc.__version__, c.__version__)\"",
    "python -m pytest -q {project}/tests/test_lifecycle.py {project}/tests/test_standalone_contract.py",
]

# ---------------------------------------------------------------------------
# Lint / typecheck config (ruff + mypy).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
# Both are import roots: the package lives under src/, and each example script runs
# with examples/ on sys.path (it imports its sibling _common). Listing both keeps
# import sorting from filing our own modules as third-party.
src = ["src", "examples"]
# vendor/ is the upstream FANUC driver (a submodule); build/ holds the CMake
# FetchContent checkouts of pybind11 / ruckig / googletest. Neither is ours to lint
# or reformat. extend-exclude rather than exclude: `exclude` REPLACES ruff's built-in
# list (.venv, site-packages, dist, ...), and that built-in list does not contain
# `build`, so both names are needed here regardless.
extend-exclude = ["vendor", "build"]
# Honour those excludes even when a path is passed explicitly, which is what an
# editor integration and a pre-commit hook both do.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# 3.12 rather than the 3.10 floor in requires-python: numpy's bundled stubs use
# PEP 695 `type` statements, which mypy only parses under 3.12+. Pinning 3.10 here
# makes mypy abort inside numpy before it checks any of our code.
python_version = "3.12"
packages = ["airo_fanuc"]
mypy_path = "src"
ignore_missing_imports = true
