# Reserve the SMT pair 15+31 away from ALL user-spawned processes (PLAN §5.5, R1 E1).
#
# Drop-in for user.slice. Confines every user process (interactive shells, uv,
# editors, `uv run grocery-*` when NOT launched into grocery-demo.slice) to logical
# cores 0-14,16-30 — i.e. off both core 31 (the FANUC RT thread) and its SMT
# sibling core 15. Only grocery-demo.slice (AllowedCPUs=0-31) may touch the pair.
#
# This SUPERSEDES 99-reserve-core-31.conf (which used AllowedCPUs=0-30, reserving
# only 31): R1 E1 found core 31's hyperthread sibling is core 15
# (thread_siblings_list=15,31), so contention on 15 steals cycles from 31's
# physical core. Reserving the pair is what actually isolates the RT thread.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/user.slice.d
#   sudo cp 99-reserve-smt-pair.conf /etc/systemd/system/user.slice.d/
#   sudo rm -f /etc/systemd/system/user.slice.d/99-reserve-core-31.conf   # remove the old single-core reservation
#   sudo systemctl daemon-reload
# Verify: systemctl show user.slice -p AllowedCPUs  → 0-14,16-30

[Slice]
AllowedCPUs=0-14,16-30
