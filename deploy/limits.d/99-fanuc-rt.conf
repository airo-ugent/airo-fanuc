# 99-fanuc-rt.conf — rtprio + memlock limits for the FANUC RT thread (PLAN §5.5, R4).
#
# The RT core self-pins to core 31 and (when enabled) runs SCHED_FIFO with an early
# mlockall(MCL_CURRENT|MCL_ONFAULT) before the CUDA imports. SCHED_FIFO needs
# RLIMIT_RTPRIO and mlockall needs RLIMIT_MEMLOCK; grant both to the demo user so
# an interactive `uv run grocery-robot` can raise priority + lock pages without
# root. (When the demo is launched via `systemd-run --slice=grocery-demo.slice`,
# pass -p LimitRTPRIO=99 -p LimitMEMLOCK=infinity instead — that path does not read
# /etc/security/limits.d.)
#
# DROP-CRITERION (PLAN §5.5 / R4, L3 ablation): SCHED_FIFO + mlock ship
# DISABLED-by-default in DriverConfig (pin_core / sched_fifo / mlock all False).
# If affinity-only (pin to 31, no FIFO, no mlock) holds p99 ≤ 8.5 ms & max < 16 ms
# over the 1 h adversarial soak, these limits stay unused and can be dropped. Only
# if the soak needs FIFO/mlock do they get enabled in the entry point AND these
# limits become load-bearing. Installing this file is harmless either way.
#
# Install:
#   sudo cp 99-fanuc-rt.conf /etc/security/limits.d/99-fanuc-rt.conf
#   # log out / back in (or restart the systemd user session) for PAM limits to apply
# Verify (as dmarzoug):  ulimit -r  → 99 ;  ulimit -l  → unlimited

# <domain>      <type>  <item>    <value>
dmarzoug        -       rtprio    99
dmarzoug        -       memlock   unlimited
