# Reserve the SMT pair 15+31 away from ALL system services (PLAN §5.5, R1 E1).
#
# Drop-in for system.slice. Confines every system service (NetworkManager, snapd,
# dbus, journald, …) to logical cores 0-14,16-30 — off core 31 (the FANUC RT
# thread) and its SMT sibling core 15. grocery-demo.slice is NOT under system.slice,
# so this drop-in does not constrain the demo/RT thread.
#
# This SUPERSEDES 99-reserve-core-31.conf (AllowedCPUs=0-30). See the matching
# user.slice.d drop-in for the SMT-sibling rationale (R1 E1: siblings are 15,31).
#
# Install:
#   sudo mkdir -p /etc/systemd/system/system.slice.d
#   sudo cp 99-reserve-smt-pair.conf /etc/systemd/system/system.slice.d/
#   sudo rm -f /etc/systemd/system/system.slice.d/99-reserve-core-31.conf   # remove the old single-core reservation
#   sudo systemctl daemon-reload
# Verify: systemctl show system.slice -p AllowedCPUs  → 0-14,16-30

[Slice]
AllowedCPUs=0-14,16-30
